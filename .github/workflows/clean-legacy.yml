name: Clean legacy false positives
on:
  push:
    paths:
      - 'sanitize_feed.py'
      - '.github/workflows/clean-legacy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Offline research quality gate
        run: |
          python -m unittest discover -s tests -v
          python sanitize_feed.py
      - name: Publish cleaned data only when modified
        run: |
          if git diff --quiet -- public/data/feed.json public/data/archive.json; then
            echo 'No invalid data to remove.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/feed.json public/data/archive.json
          git commit -m 'data: remove non-research false positives'
          git push
