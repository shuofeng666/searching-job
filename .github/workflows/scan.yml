name: Research internship scan
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internship-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Test scanner before paid search
        run: python -m unittest discover -s tests -v
      - name: Search research internships and historical evidence
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo 'SERPAPI_KEY is not configured. Skipping paid search.'
            exit 0
          fi
          python scanner_v3.py
      - name: Commit public vacancy feed and archive only
        run: |
          if git diff --quiet -- public/data/feed.json public/data/archive.json; then
            echo 'No new feed data to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/feed.json public/data/archive.json
          git commit -m 'data: update research internship feed and history'
          git push
