name: Validate research radar
on:
  push:
    paths:
      - 'scanner_v2.py'
      - 'scanner_v3.py'
      - 'ui_patch.py'
      - 'radar.py'
      - 'api/**'
      - 'public/scan-control.js'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Python scanner and HTML patch tests
        run: python -m unittest discover -s tests -v
      - name: Validate Node scan function and UI script syntax
        run: |
          node --check api/scan.js
          node --check public/scan-control.js
